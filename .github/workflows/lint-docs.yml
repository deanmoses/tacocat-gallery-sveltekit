# The main CI workflow skips its build on a docs-only change, so markdown
# gets this separate, build-free workflow. Its path list must match the
# non-code paths that ci.yml's detect-code-changes job excludes.
name: Lint docs

on:
    push:
        branches: [main]
        paths:
            - '**.md'
            - '.markdownlint.jsonc'
            - '.markdownlint-cli2.jsonc'
    pull_request:
        branches: [main]
        paths:
            - '**.md'
            - '.markdownlint.jsonc'
            - '.markdownlint-cli2.jsonc'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    HUSKY: 0

jobs:
    markdownlint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Lint markdown
              run: npx markdownlint-cli2
