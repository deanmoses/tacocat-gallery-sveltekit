name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - '*.md'
            - 'LICENSE'
            - '.gitignore'
            - 'docs/**'
    pull_request:
        branches: [main]
        paths-ignore:
            - '*.md'
            - 'LICENSE'
            - '.gitignore'
            - 'docs/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true # Cancel previous runs when new commits push

env:
    HUSKY: 0 # Skip git hooks in CI - we run checks directly

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run check

            - name: Unit tests
              run: npm run test:unit

            - name: Build
              run: npm run build

            # Upload build artifacts for deploy job
            - name: Upload build artifacts
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v7
              with:
                  name: build
                  path: build/
                  retention-days: 1

    deploy:
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: build
                  path: build/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: Deploy to staging
              run: ./deploy_staging.sh

    smoke-test:
        needs: deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run smoke test against staging
              run: npm run test:e2e:staging

            # Uploaded on success too: a run that only passed on retry is
            # exactly the one worth looking at, and failure() would skip it.
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
