name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true # Cancel previous runs when new commits push

permissions:
    contents: read

env:
    HUSKY: 0 # Skip git hooks in CI - we run checks directly

jobs:
    # Docs-only changes skip the build and the deploy. A `paths-ignore` on the
    # trigger would do that too, but a run that never starts never reports,
    # and branch protection needs a check that always does: merge-ok below.
    detect-code-changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read # paths-filter lists a pull request's files through the API
        outputs:
            code_changed: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  fetch-depth: 0 # on push, paths-filter diffs against the previous commit
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  predicate-quantifier: 'every'
                  filters: |
                      code:
                        - '**'
                        - '!**/*.md'
                        - '!.markdownlint.jsonc'
                        - '!.markdownlint-cli2.jsonc'
                        - '!LICENSE'
                        - '!.gitignore'
                        - '!docs/**'

    build:
        needs: detect-code-changes
        if: ${{ needs.detect-code-changes.outputs.code_changed == 'true' }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            # Ahead of npm ci, whose prepare script installs the browsers:
            # restoring afterwards would be too late to skip the download
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  # Any lockfile change misses the exact key, so fall back to the
                  # last browsers cached: a dependency bump rarely moves Playwright
                  restore-keys: playwright-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            # shellcheck is preinstalled on GitHub's ubuntu runners
            - name: Lint shell scripts
              run: npm run lint:shell

            # Pinned and checksummed rather than pulled from a third-party
            # action, so a compromised upstream can't reach the deploy job
            - name: Install actionlint
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL -o "$archive" \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
                  echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
                  tar -xzf "$archive" actionlint
                  sudo install actionlint /usr/local/bin/actionlint
                  rm -f "$archive" actionlint

            - name: Lint workflows
              run: npm run lint:actions

            - name: Type check
              run: npm run check

            - name: Install Playwright browsers
              run: npx playwright install chromium

            - name: Unit tests
              run: npm run test:unit

            # Staging build: app.html's preconnect hints are substituted at build time, so the
            # artifact is specific to one environment rather than promoted between them.
            - name: Build
              run: npm run build -- --mode staging

            # Upload build artifacts for deploy job
            - name: Upload build artifacts
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v7
              with:
                  name: build-staging
                  path: build/
                  retention-days: 1

    # A docs-only change skips the build, and with it the markdown lint that
    # `npm run lint` runs, so it gets this build-free job instead.
    lint-docs:
        needs: detect-code-changes
        if: ${{ needs.detect-code-changes.outputs.code_changed == 'false' }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Lint markdown
              run: npx markdownlint-cli2

    # The check branch protection requires. Passes when the job the detector
    # chose (the build for code changes, the docs lint otherwise) succeeded.
    # Anything else, including a detector that answered nothing at all,
    # fails: this must not fail open.
    merge-ok:
        needs: [detect-code-changes, build, lint-docs]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check required jobs
              env:
                  DETECT_RESULT: ${{ needs.detect-code-changes.result }}
                  CODE_CHANGED: ${{ needs.detect-code-changes.outputs.code_changed }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  LINT_DOCS_RESULT: ${{ needs.lint-docs.result }}
              run: |
                  if [[ "$DETECT_RESULT" != "success" ]]; then
                      echo "detect-code-changes failed (result: $DETECT_RESULT)"
                      exit 1
                  fi
                  case "$CODE_CHANGED" in
                      true)
                          if [[ "$BUILD_RESULT" != "success" ]]; then
                              echo "Code changed but the build did not succeed (result: $BUILD_RESULT)"
                              exit 1
                          fi
                          echo "Code changed and the build passed"
                          ;;
                      false)
                          if [[ "$LINT_DOCS_RESULT" != "success" ]]; then
                              echo "No code changes but the docs lint did not succeed (result: $LINT_DOCS_RESULT)"
                              exit 1
                          fi
                          echo "No code changes and the docs lint passed"
                          ;;
                      *)
                          echo "Unexpected code_changed value: '$CODE_CHANGED'"
                          exit 1
                          ;;
                  esac

    deploy:
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # lets the job request a GitHub OIDC token to assume an AWS role

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: build-staging
                  path: build/

            - name: Configure AWS credentials
              # No stored keys: the job trades its GitHub OIDC token for a short-lived AWS role
              # that can only sync the staging bucket and invalidate its distribution.
              # Roles are defined in infra/github-oidc.yaml.
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::010410881828:role/tacocat-gallery-sveltekit-cicd-github-main
                  role-session-name: github-${{ github.run_id }}
                  aws-region: us-east-1

            - name: Deploy to staging
              run: ./scripts/deploy-staging.sh

    smoke-test:
        needs: deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            # Ahead of npm ci, whose prepare script installs the browsers:
            # restoring afterwards would be too late to skip the download
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  # Any lockfile change misses the exact key, so fall back to the
                  # last browsers cached: a dependency bump rarely moves Playwright
                  restore-keys: playwright-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install chromium

            - name: Run smoke test against staging
              run: npm run test:e2e:staging

            # Uploaded on success too: a run that only passed on retry is
            # exactly the one worth looking at, and failure() would skip it.
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
